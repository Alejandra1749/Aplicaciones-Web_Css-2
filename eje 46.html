<html lang="es">
<head>

      background-color: #dfe6e9;

      box-sizing: border-box;
    }

</head>

  <div id="cabecera">Cabecera</div>
  <div class="contenedor">
    <div id="col1"><p>columna1 columna1 columna1 columna1</p></div>
    <div id="col2"><h2>Título de la columna</h2><p>Contenido columna2 Contenido columna2 Contenido columna2</p></div>
    <div id="col3"><p>columna3 columna3 columna3 columna3</p></div>
  </div>

</html>
